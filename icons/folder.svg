<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cynosure folder template. build.py renders one icon per entry in
  icons/manifest.json, filling in these placeholders (double braces):
    palette names   colours from common/_palette.scss (as everywhere)
    face-a, face-b  face gradient (top-left -> bottom-right)
    label           colour of the filing label
    glyph           contents of icons/glyphs/NAME.svg (32x32 box)

  Geometry: the folder is drawn upright in local coordinates and then
  skewed (skewY 20deg), like the slanted datafile icons in the references.
  Face: 66 x 64, tabs above y=0, side edge to the right. The whole group is
  scaled so the slanted folder fills the 128px canvas (bounds ~84 x 120).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{face-a}}"/>
      <stop offset="1" stop-color="{{face-b}}"/>
    </linearGradient>
  </defs>

  <g transform="translate(22 12.4) scale(1.18) skewY(20)" stroke-linejoin="miter">
    <!-- drop shadow -->
    <rect x="5" y="5" width="66" height="64" fill="#000" fill-opacity="0.28"/>

    <!-- side edge (thickness) -->
    <path d="M66 0 L71 -3 V61 L66 64 Z" fill="{{folder-edge}}"
          stroke="{{folder-line}}" stroke-width="2"/>

    <!-- tabs of the sheet behind: one long, one short -->
    <path d="M2 1 V-6 L4 -8 H38 L40 -6 V1 Z" fill="{{folder}}"
          stroke="{{folder-line}}" stroke-width="2"/>
    <path d="M44 1 V-6 L46 -8 H62 L64 -6 V1 Z" fill="{{folder}}"
          stroke="{{folder-line}}" stroke-width="2"/>

    <!-- front face -->
    <rect x="0" y="0" width="66" height="64" fill="url(#face)"
          stroke="{{folder-line}}" stroke-width="2.5"/>

    <!-- fold line under the tabs -->
    <path d="M1.5 8 H64.5" stroke="{{folder-line}}" stroke-width="1.5" stroke-opacity="0.55"/>
    <path d="M1.5 10 H64.5" stroke="{{folder-edge}}" stroke-width="1" stroke-opacity="0.45"/>

    <!-- filing label -->
    <rect x="6" y="50" width="24" height="9" fill="{{label}}"
          stroke="{{folder-line}}" stroke-width="1.5"/>
    <path d="M9.5 54.5 H22" stroke="{{folder-line}}" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- printed glyph, 32x32 box centred on the face -->
    <g transform="translate(17 13)" color="{{folder-line}}" fill="none"
       stroke="{{folder-line}}" stroke-width="3" stroke-opacity="0.85">
      {{glyph}}
    </g>
  </g>
</svg>
