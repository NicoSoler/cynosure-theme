# Cynosure — fuzzel launcher. GENERATED from sway/fuzzel/fuzzel.ini by build.py.
# A parchment "SYSTEM CONSOLE" box with navy selection.

[main]
font=Rajdhani:weight=semibold:size=14
prompt="> "
icon-theme=Adwaita
icons-enabled=yes
terminal=foot -e
width=42
lines=10
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=26
letter-spacing=1

[colors]
background={{paper|bare|f5}}
text={{ink|bare|ff}}
prompt={{navy|bare|ff}}
placeholder={{ink-soft|bare|ff}}
input={{ink|bare|ff}}
match={{red|bare|ff}}
selection={{navy|bare|ff}}
selection-text={{paper-light|bare|ff}}
selection-match={{amber|bare|ff}}
counter={{ink-soft|bare|ff}}
border={{navy|bare|ff}}

[border]
width=3
radius=0
