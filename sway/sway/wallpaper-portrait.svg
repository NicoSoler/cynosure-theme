<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2560" viewBox="0 0 1440 2560">
  <!-- Cynosure wallpaper (portrait). GENERATED from sway/sway/wallpaper-portrait.svg
       by build.py. The Cynosure mark is shared with wallpaper.svg: keep both in sync. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="{{void-light}}"/>
      <stop offset="1" stop-color="{{void}}"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="{{cream}}" fill-opacity="0.025"/>
    </pattern>

    <!-- Cynosure mark, radius 46, centred on 0,0 (see wallpaper.svg). -->
    <pattern id="mark-stripes" width="92" height="7.08" y="-46" patternUnits="userSpaceOnUse">
      <rect width="92" height="5.1" fill="#fff"/>
    </pattern>
    <mask id="mark" maskUnits="userSpaceOnUse" x="-50" y="-50" width="100" height="100">
      <circle r="46" fill="url(#mark-stripes)"/>
      <ellipse rx="30" ry="21" fill="#fff"/>
      <rect x="-22" y="-1.7" width="44" height="3.4" fill="#000"/>
      <circle r="14" fill="#000"/>
      <circle r="3" fill="#fff"/>
    </mask>
  </defs>

  <rect width="1440" height="2560" fill="url(#glow)"/>
  <rect width="1440" height="2560" fill="url(#scan)"/>

  <!-- Mark + wordmark, centred near the bottom (the block is 495 wide) -->
  <g transform="translate(518.5 2420)" fill="{{cream}}" opacity="0.5">
    <rect x="-46" y="-46" width="92" height="92" mask="url(#mark)"/>
    <text x="60" y="11.5" font-family="Times New Roman, Liberation Serif, Nimbus Roman, serif"
          font-size="72">CYNOSURE</text>
    <text x="62" y="39" font-family="Arial, Liberation Sans, Nimbus Sans, sans-serif"
          font-size="18">ENCRYPTION MEASURES &amp; DEFENSIVE ICE</text>
  </g>
</svg>
